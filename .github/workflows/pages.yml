# Statisches Deployment nach GitHub Pages.
#
# Es gibt keinen Build-Schritt: der Trainer ist reines HTML/CSS/JS ohne
# Abhaengigkeiten. Der Workflow prueft nur die Tests und laedt danach das
# Repository unveraendert als Pages-Artefakt hoch.
#
# Der Testlauf ist Absicht: bricht er, wird nicht deployt. Sonst koennte
# eine kaputte Precache-Liste im Service Worker unbemerkt online gehen und
# die App waere auf dem Handy still nicht mehr offline-faehig.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smoke-Test
        run: node test/smoke.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
